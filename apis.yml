aid: arcstone
name: Arcstone
description: >-
  Arcstone is a Singapore-based digital manufacturing technology company (founded
  2013) that helps enterprises digitalize and gain real-time transparency across
  their shop floors and supply chains. Its product family spans arc.essentials (a
  lightweight Manufacturing Execution System for SMEs), arc.ops (a modular,
  next-generation MES for large enterprises), arc.net (multi-tier supply chain
  visibility), arc.studio (a low-code enterprise app and integration platform),
  arc.green (sustainability tracking), and arc.ai (an AI control tower for managed
  AI workforce deployment). Arcstone serves precision engineering, FMCG, mining,
  semiconductor, plastics, and biomedical manufacturers, and was named a Gartner
  Cool Vendor in Manufacturing Operations in 2022. The company is backed by 500
  Global. No public API, developer portal, or SDKs are published at this time; this
  profile carries the identity and infrastructure signals harvested by the API
  Evangelist enrichment pipeline.
